name: Product checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
      # Official release refs verified through api.github.com/repos/<owner>/<repo>/git/ref/tags/<version>.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@6b9c6063abd6010835644d4c2e1bef4cf5cd0fca # v6.0.1
        with:
          version: "0.8.22"
          enable-cache: false
      - name: Install locked dependencies
        run: uv sync --locked --all-groups
      - name: Test
        run: uv run --locked pytest
      - name: Lint
        run: uv run --locked ruff check .
      - name: Type check
        run: uv run --locked mypy
      - name: Check ownership boundary
        run: python scripts/check_boundary.py
      - name: Build product distributions
        run: uv build --no-sources --no-build-isolation
      - name: Check every built distribution
        shell: bash
        run: |
          artifacts=()
          for artifact in dist/*.whl dist/*.tar.gz; do
            test -f "$artifact"
            artifacts+=(--artifact "$artifact")
          done
          python scripts/check_boundary.py --artifact-mode "${artifacts[@]}"
